{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">👥 Clients</h2>

<!-- Search bar -->
<form method="get" class="mb-3">
    <div class="input-group">
        <input type="text" name="search" class="form-control"
               placeholder="Rechercher un client..."
               value="{{ search if search else '' }}">
        <button class="btn btn-primary">Rechercher</button>
    </div>
</form>

<!-- Customers table -->
<div class="card shadow-sm">
    <div class="card-body">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nom complet</th>
                    <th>Email</th>
                    <th>Ville</th>
                    <th>Commandes</th>
                    <th>Total dépensé</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for c in customers %}
                <tr>
                    <td>{{ c.full_name }}</td>
                    <td>{{ c.email }}</td>
                    <td>{{ c.city }}</td>
                    <td>{{ c.orders_count }}</td>
                    <td>{{ c.total_spent }} €</td>
                    <td>
                        <a href="/customers/{{ c.id }}" class="btn btn-sm btn-secondary">
                            Voir détails
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
