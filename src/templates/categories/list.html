{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">🏷️ Catégories</h2>

<!-- Add category -->
<div class="mb-3">
    <a href="/categories/create" class="btn btn-success">➕ Ajouter une catégorie</a>
</div>

<!-- Categories table -->
<div class="card shadow-sm">
    <div class="card-body">

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Description</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                {% for c in categories %}
                <tr>
                    <td>{{ c.name }}</td>
                    <td>{{ c.description }}</td>
                    <td>
                        <a href="/categories/edit/{{ c.id }}" class="btn btn-sm btn-secondary">Modifier</a>
                        <a href="/categories/delete/{{ c.id }}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Supprimer cette catégorie ?');">
                           Supprimer
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>
</div>

{% endblock %}
