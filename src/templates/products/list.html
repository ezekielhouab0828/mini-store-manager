{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">📦 Produits</h2>

<!-- Search + Filters -->
<form method="get" class="row mb-4">

    <!-- Search -->
    <div class="col-md-4 mb-2">
        <input type="text" name="search" class="form-control"
               placeholder="Rechercher un produit..."
               value="{{ search if search else '' }}">
    </div>

    <!-- Category filter -->
    <div class="col-md-3 mb-2">
        <select name="category" class="form-select">
            <option value="">Toutes les catégories</option>
            {% for cat in categories %}
                <option value="{{ cat.id }}" {% if category_id == cat.id|string %}selected{% endif %}>
                    {{ cat.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- Sort -->
    <div class="col-md-3 mb-2">
        <select name="sort" class="form-select">
            <option value="name" {% if sort == "name" %}selected{% endif %}>Trier par nom</option>
            <option value="price" {% if sort == "price" %}selected{% endif %}>Trier par prix</option>
        </select>
    </div>

    <div class="col-md-2 mb-2">
        <button class="btn btn-primary w-100">Filtrer</button>
    </div>
</form>

<!-- Add product -->
<div class="mb-3">
    <a href="/products/create" class="btn btn-success">➕ Ajouter un produit</a>
</div>

<!-- Products table -->
<div class="card shadow-sm">
    <div class="card-body">

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Catégorie</th>
                    <th>Prix</th>
                    <th>Stock</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                {% for p in products %}
                <tr class="{% if p.stock < 5 %}table-warning{% endif %}">
                    <td>{{ p.name }}</td>
                    <td>{{ p.category_name }}</td>
                    <td>{{ p.price }} €</td>
                    <td>
                        {{ p.stock }}
                        {% if p.stock < 5 %}
                            <span class="badge bg-danger">Stock bas</span>
                        {% endif %}
                    </td>
                    <td>
                        <a href="/products/edit/{{ p.id }}" class="btn btn-sm btn-secondary">Modifier</a>
                        <a href="/products/delete/{{ p.id }}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Supprimer ce produit ?');">
                           Supprimer
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>
</div>

{% endblock %}
